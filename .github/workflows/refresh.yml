name: Intraday refresh
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline (intraday, no state writes)
        env:
          INTRADAY: '1'
        run: |
          cd pipeline
          python run_daily.py
          cp dashboard.html ../index.html
      - name: Commit index.html only
        run: |
          git checkout -- pipeline || true
          git config user.name minervini-refresh
          git config user.email actions@github.com
          git add index.html
          git commit -m "intraday refresh $(TZ=America/Phoenix date +%F_%H%M)" || exit 0
          git pull --rebase -X theirs origin main || true
          git push origin HEAD:main
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
